    function populateCategories() {
      const categorySelect = document.getElementById("blog-category-filter");
      const categories = Array.from(new Set(blogPosts.map(p => p.category.trim().toUpperCase())));
      
      categories.forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        categorySelect.appendChild(option);
      });
    }

    function renderBlogTable(posts) {
      const tbody = document.getElementById("blog-table-body");
      const countDisplay = document.getElementById("article-count-display");

      if (countDisplay) {
        countDisplay.textContent = posts ? posts.length : 0;
      }

      if (!posts || posts.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="py-8 px-6 text-center text-slate-500 font-mono text-xs">
              No articles found matching the selected category.
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = posts.map(post => `
        <tr class="hover:bg-slate-800/40 transition-colors group">
          <td class="py-4 px-6 font-mono text-slate-400 whitespace-nowrap text-xs">
            ${post.dateFormatted}
          </td>
          <td class="py-4 px-6 whitespace-nowrap">
            <span class="text-[10px] font-mono font-semibold text-sky-400 bg-sky-950/60 border border-sky-800/50 px-2.5 py-0.5 rounded uppercase tracking-wider">
              ${post.category}
            </span>
          </td>
          <td class="py-4 px-6 text-white font-medium group-hover:text-sky-300 transition-colors">
            <a href="${post.url}" class="hover:text-sky-300 transition-colors">${post.title}</a>
          </td>
          <td class="py-4 px-6 text-right whitespace-nowrap">
            <a href="${post.url}" class="text-sky-400 hover:text-sky-300 font-semibold inline-flex items-center gap-1.5 transition-colors">
              Read Article <i class="fa-solid fa-arrow-right text-[10px]"></i>
            </a>
          </td>
        </tr>
      `).join("");
    }

    function filterAndSortBlogs() {
      const selectedCategory = document.getElementById("blog-category-filter").value;
      const sortOrder = document.getElementById("blog-sort-order").value;

      let filtered = [...blogPosts];

      if (selectedCategory !== "ALL") {
        filtered = filtered.filter(post => post.category.trim().toUpperCase() === selectedCategory);
      }

      filtered.sort((a, b) => {
        const dateA = new Date(a.date);
        const dateB = new Date(b.date);
        return sortOrder === "NEWEST" ? dateB - dateA : dateA - dateB;
      });

      renderBlogTable(filtered);
    }

    document.addEventListener("DOMContentLoaded", () => {
      populateCategories();
      filterAndSortBlogs();
      document.getElementById("current-year").textContent = new Date().getFullYear();
    });
